<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#fff4f8">

  <title>愛上學活動簽到掃描器</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --pink: #ef5a91;
      --pink-light: #fff4f8;
      --green: #2e7d32;
      --orange: #d97706;
      --red: #c62828;
      --blue: #4688d8;
      --text: #333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px 36px;
      background: var(--pink-light);
      color: var(--text);
      text-align: center;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        Arial,
        sans-serif;
    }

    h1 {
      margin: 12px 0 8px;
      color: var(--pink);
      font-size: clamp(30px, 5vw, 48px);
    }

    .subtitle {
      margin: 0 auto 10px;
      max-width: 760px;
      font-size: clamp(18px, 3vw, 26px);
      line-height: 1.55;
    }

    #camera-name {
      margin: 12px auto 16px;
      color: #666;
      font-size: 18px;
      font-weight: 700;
    }

    #reader {
      width: min(92vw, 680px);
      min-height: 300px;
      margin: 18px auto;
      overflow: hidden;
      border: 4px solid #fff;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      min-height: 300px;
      object-fit: cover;
      border-radius: 20px;
    }

    .controls {
      width: min(92vw, 680px);
      margin: 14px auto;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      min-width: 210px;
      min-height: 66px;
      padding: 14px 22px;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.15);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #start-button {
      background: var(--green);
    }

    #switch-button {
      background: var(--blue);
    }

    #status {
      width: min(92vw, 680px);
      min-height: 76px;
      margin: 18px auto 0;
      padding: 18px;
      border-radius: 18px;
      background: #fff;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    #status.ready,
    #status.success {
      color: var(--green);
    }

    #status.processing {
      color: var(--orange);
    }

    #status.error {
      color: var(--red);
    }

    .hint {
      margin-top: 14px;
      color: #666;
      font-size: 16px;
      line-height: 1.7;
    }

    #checkin-frame {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      border: 0;
    }
  </style>
</head>

<body>

  <h1>愛上學活動簽到</h1>

  <p id="subtitle" class="subtitle">
    請先按下「啟動掃描器」
  </p>

  <div id="camera-name">
    相機尚未啟動
  </div>

  <div id="reader"></div>

  <div class="controls">
    <button id="start-button" type="button">
      啟動掃描器
    </button>

    <button id="switch-button" type="button" disabled>
      🔄 切換鏡頭
    </button>
  </div>

  <div id="status" class="ready">
    請按「啟動掃描器」
  </div>

  <div class="hint">
    第一次使用時，請允許 Safari 使用相機。<br>
    掃描後會自動完成簽到，約 3 秒後可掃下一位。
  </div>

  <iframe
    id="checkin-frame"
    title="簽到處理"
  ></iframe>

  <script>
    const statusBox = document.getElementById("status");
    const checkinFrame = document.getElementById("checkin-frame");
    const startButton = document.getElementById("start-button");
    const switchButton = document.getElementById("switch-button");
    const subtitle = document.getElementById("subtitle");
    const cameraName = document.getElementById("camera-name");

    const scanner = new Html5Qrcode("reader");

    let cameras = [];
    let currentCameraIndex = 0;
    let scannerRunning = false;
    let switchingCamera = false;
    let processing = false;
    let lastCode = "";
    let lastScanAt = 0;

    const scannerConfig = {
      fps: 12,

      qrbox: function(viewfinderWidth, viewfinderHeight) {
        const minimumSide = Math.min(
          viewfinderWidth,
          viewfinderHeight
        );

        const size = Math.max(
          220,
          Math.floor(minimumSide * 0.68)
        );

        return {
          width: size,
          height: size
        };
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    };

    function setStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = type;
    }

    function isValidCheckinUrl(text) {
      try {
        const url = new URL(text);

        return (
          url.protocol === "https:" &&
          url.hostname === "script.google.com" &&
          url.pathname.includes("/macros/s/") &&
          url.searchParams.has("id")
        );
      } catch (_) {
        return false;
      }
    }

    function findBestStartingCamera(cameraList) {
      const backWords = [
        "back",
        "rear",
        "environment",
        "後置",
        "後鏡頭",
        "背面"
      ];

      const backIndex = cameraList.findIndex(function(camera) {
        const label = (camera.label || "").toLowerCase();

        return backWords.some(function(word) {
          return label.includes(word);
        });
      });

      if (backIndex >= 0) {
        return backIndex;
      }

      /*
        iPad 通常前鏡頭會排在前面，
        後鏡頭可能排在最後，因此找不到名稱時先選最後一個。
      */
      return Math.max(0, cameraList.length - 1);
    }

    function isFrontCamera(camera) {
      const label = (camera.label || "").toLowerCase();

      return (
        label.includes("front") ||
        label.includes("user") ||
        label.includes("前置") ||
        label.includes("前鏡頭")
      );
    }

    function updateCameraDisplay() {
      const camera = cameras[currentCameraIndex];

      if (!camera) {
        cameraName.textContent = "相機尚未啟動";
        subtitle.textContent = "請先按下「啟動掃描器」";
        return;
      }

      const label = camera.label || "";

      if (isFrontCamera(camera)) {
        cameraName.textContent = "目前使用：前鏡頭";
        subtitle.textContent =
          "請將家長機票上的 QR Code 對準 iPad 前鏡頭";
      } else {
        cameraName.textContent = "目前使用：後鏡頭";
        subtitle.textContent =
          "請將家長機票上的 QR Code 對準 iPad 後鏡頭";
      }

      if (cameras.length <= 1) {
        switchButton.textContent = "此裝置只有一個鏡頭";
        switchButton.disabled = true;
      } else {
        switchButton.textContent = "🔄 切換鏡頭";
        switchButton.disabled = false;
      }
    }

    async function loadCameras() {
      setStatus("正在取得相機權限⋯⋯", "processing");

      cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error("找不到可使用的相機");
      }

      currentCameraIndex = findBestStartingCamera(cameras);
    }

    async function startCurrentCamera() {
      const camera = cameras[currentCameraIndex];

      if (!camera) {
        throw new Error("找不到指定的相機");
      }

      await scanner.start(
        camera.id,
        scannerConfig,
        onScanSuccess,
        onScanFailure
      );

      scannerRunning = true;
      updateCameraDisplay();

      startButton.style.display = "none";
      switchButton.disabled = cameras.length <= 1;

      setStatus("等待掃描中⋯⋯", "ready");
    }

    async function startScanner() {
      if (scannerRunning || switchingCamera) {
        return;
      }

      startButton.disabled = true;
      switchButton.disabled = true;

      try {
        await loadCameras();
        await startCurrentCamera();
      } catch (error) {
        console.error("啟動相機失敗：", error);

        scannerRunning = false;
        startButton.disabled = false;
        startButton.style.display = "inline-block";
        switchButton.disabled = true;

        setStatus(
          "無法開啟相機，請重新整理網頁後再按一次",
          "error"
        );
      }
    }

    async function stopScanner() {
      if (!scannerRunning) {
        return;
      }

      await scanner.stop();
      scannerRunning = false;
    }

    async function switchCamera() {
      if (
        switchingCamera ||
        processing ||
        !scannerRunning ||
        cameras.length <= 1
      ) {
        return;
      }

      switchingCamera = true;
      switchButton.disabled = true;

      setStatus("正在切換鏡頭⋯⋯", "processing");

      const oldIndex = currentCameraIndex;

      try {
        await stopScanner();

        currentCameraIndex =
          (currentCameraIndex + 1) % cameras.length;

        await startCurrentCamera();
      } catch (error) {
        console.error("切換鏡頭失敗：", error);

        currentCameraIndex = oldIndex;

        try {
          await scanner.start(
            cameras[currentCameraIndex].id,
            scannerConfig,
            onScanSuccess,
            onScanFailure
          );

          scannerRunning = true;
          updateCameraDisplay();

          setStatus(
            "鏡頭切換失敗，已恢復原本鏡頭",
            "error"
          );

          setTimeout(function() {
            if (!processing) {
              setStatus("等待掃描中⋯⋯", "ready");
            }
          }, 2200);
        } catch (restartError) {
          console.error("恢復相機失敗：", restartError);

          scannerRunning = false;
          startButton.style.display = "inline-block";
          startButton.disabled = false;

          setStatus(
            "相機停止運作，請重新整理網頁",
            "error"
          );
        }
      } finally {
        switchingCamera = false;

        if (scannerRunning && cameras.length > 1) {
          switchButton.disabled = false;
        }
      }
    }

    function pauseScanner() {
      try {
        if (scannerRunning) {
          scanner.pause(true);
        }
      } catch (error) {
        console.warn("暫停掃描器失敗：", error);
      }
    }

    function resumeScanner() {
      processing = false;
      checkinFrame.removeAttribute("src");

      try {
        if (scannerRunning) {
          scanner.resume();
        }
      } catch (error) {
        console.warn("恢復掃描器失敗：", error);
      }

      setStatus("等待掃描中⋯⋯", "ready");

      if (scannerRunning && cameras.length > 1) {
        switchButton.disabled = false;
      }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();

      if (processing || switchingCamera) {
        return;
      }

      if (
        decodedText === lastCode &&
        now - lastScanAt < 5000
      ) {
        return;
      }

      lastCode = decodedText;
      lastScanAt = now;

      if (!isValidCheckinUrl(decodedText)) {
        setStatus(
          "這不是有效的學生簽到 QR Code",
          "error"
        );

        setTimeout(function() {
          if (!processing) {
            setStatus("等待掃描中⋯⋯", "ready");
          }
        }, 2200);

        return;
      }

      processing = true;
      switchButton.disabled = true;

      setStatus("簽到處理中⋯⋯", "processing");

      pauseScanner();

      checkinFrame.src = decodedText;

      setTimeout(function() {
        setStatus(
          "✅ 已送出簽到，可準備下一位",
          "success"
        );
      }, 1200);

      setTimeout(resumeScanner, 3500);
    }

    function onScanFailure(_) {
      // 沒有掃到 QR Code 時保持掃描，不顯示錯誤。
    }

    startButton.addEventListener(
      "click",
      startScanner
    );

    switchButton.addEventListener(
      "click",
      switchCamera
    );
  </script>

</body>
</html>
