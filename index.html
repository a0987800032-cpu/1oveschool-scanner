<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#fff4f8">

  <title>愛上學活動簽到掃描器</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --pink: #ef5a91;
      --pink-light: #fff4f8;
      --green: #2e7d32;
      --orange: #d97706;
      --red: #c62828;
      --blue: #4688d8;
      --text: #333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px 36px;
      background: var(--pink-light);
      color: var(--text);
      text-align: center;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        Arial,
        sans-serif;
    }

    h1 {
      margin: 12px 0 8px;
      color: var(--pink);
      font-size: clamp(30px, 5vw, 48px);
    }

    .subtitle {
      margin: 0 auto 10px;
      max-width: 760px;
      font-size: clamp(18px, 3vw, 26px);
      line-height: 1.55;
    }

    #camera-name {
      margin: 12px auto 16px;
      color: #666;
      font-size: 18px;
      font-weight: 700;
    }

    #reader {
      width: min(92vw, 680px);
      margin: 18px auto;
      overflow: hidden;
      border: 4px solid #fff;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    /* 不裁切相機畫面 */
    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: contain !important;
      display: block;
    }

    .controls {
      width: min(92vw, 680px);
      margin: 14px auto;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      min-width: 210px;
      min-height: 62px;
      padding: 14px 22px;
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.15);
    }

    button:disabled {
      opacity: 0.5;
    }

    #start-button {
      background: var(--green);
    }

    #switch-button {
      background: var(--blue);
    }

    #status {
      width: min(92vw, 680px);
      min-height: 76px;
      margin: 18px auto 0;
      padding: 18px;
      border-radius: 18px;
      background: #fff;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    #status.ready,
    #status.success {
      color: var(--green);
    }

    #status.processing {
      color: var(--orange);
    }

    #status.error {
      color: var(--red);
    }

    .hint {
      margin-top: 14px;
      color: #666;
      font-size: 16px;
      line-height: 1.7;
    }

    #checkin-frame {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      border: 0;
    }
  </style>
</head>

<body>
  <h1>愛上學活動簽到</h1>

  <p id="subtitle" class="subtitle">
    請先按下「啟動掃描器」
  </p>

  <div id="camera-name">相機尚未啟動</div>

  <div id="reader"></div>

  <div class="controls">
    <button id="start-button" type="button">
      啟動掃描器
    </button>

    <button id="switch-button" type="button" disabled>
      🔄 切換鏡頭
    </button>
  </div>

  <div id="status" class="ready">
    請按「啟動掃描器」
  </div>

  <div class="hint">
    請將完整 QR Code 放入掃描框內。<br>
    掃描成功後，約 3 秒即可掃描下一位。
  </div>

  <iframe
    id="checkin-frame"
    title="簽到處理"
  ></iframe>

  <script>
    const statusBox = document.getElementById("status");
    const checkinFrame = document.getElementById("checkin-frame");
    const startButton = document.getElementById("start-button");
    const switchButton = document.getElementById("switch-button");
    const subtitle = document.getElementById("subtitle");
    const cameraName = document.getElementById("camera-name");

    const scanner = new Html5Qrcode("reader");

    let cameras = [];
    let currentCameraIndex = 0;
    let scannerRunning = false;
    let switchingCamera = false;
    let processing = false;
    let lastCode = "";
    let lastScanAt = 0;

    const scannerConfig = {
      fps: 15,
      qrbox: {
        width: 280,
        height: 280
      },
      disableFlip: false
    };

    function setStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = type;
    }

    function isValidCheckinUrl(text) {
      try {
        const url = new URL(text.trim());

        return (
          url.protocol === "https:" &&
          url.hostname === "script.google.com" &&
          url.pathname.includes("/macros/s/") &&
          url.searchParams.has("id")
        );
      } catch (_) {
        return false;
      }
    }

    function isFrontCamera(camera) {
      const label = (camera.label || "").toLowerCase();

      return (
        label.includes("front") ||
        label.includes("user") ||
        label.includes("前置") ||
        label.includes("前鏡頭")
      );
    }

    function findBackCameraIndex() {
      const backWords = [
        "back",
        "rear",
        "environment",
        "後置",
        "後鏡頭",
        "背面"
      ];

      const index = cameras.findIndex(function(camera) {
        const label = (camera.label || "").toLowerCase();

        return backWords.some(function(word) {
          return label.includes(word);
        });
      });

      if (index >= 0) {
        return index;
      }

      return Math.max(0, cameras.length - 1);
    }

    function updateCameraDisplay() {
      const camera = cameras[currentCameraIndex];

      if (!camera) {
        cameraName.textContent = "相機尚未啟動";
        return;
      }

      if (isFrontCamera(camera)) {
        cameraName.textContent = "目前使用：前鏡頭";
        subtitle.textContent =
          "請將家長機票上的 QR Code 對準 iPad 前鏡頭";
      } else {
        cameraName.textContent = "目前使用：後鏡頭";
        subtitle.textContent =
          "請將家長機票上的 QR Code 對準 iPad 後鏡頭";
      }
    }

    async function startCurrentCamera() {
      const camera = cameras[currentCameraIndex];

      if (!camera) {
        throw new Error("找不到相機");
      }

      await scanner.start(
        camera.id,
        scannerConfig,
        onScanSuccess,
        onScanFailure
      );

      scannerRunning = true;
      startButton.style.display = "none";
      switchButton.disabled = cameras.length <= 1;

      updateCameraDisplay();
      setStatus("等待掃描中⋯⋯", "ready");
    }

    async function startScanner() {
      if (scannerRunning || switchingCamera) {
        return;
      }

      startButton.disabled = true;
      switchButton.disabled = true;
      setStatus("正在開啟相機⋯⋯", "processing");

      try {
        cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("找不到相機");
        }

        currentCameraIndex = findBackCameraIndex();

        await startCurrentCamera();
      } catch (error) {
        console.error(error);

        scannerRunning = false;
        startButton.disabled = false;
        startButton.style.display = "inline-block";

        setStatus(
          "無法開啟相機，請重新整理網頁再試一次",
          "error"
        );
      }
    }

    async function switchCamera() {
      if (
        switchingCamera ||
        processing ||
        !scannerRunning ||
        cameras.length <= 1
      ) {
        return;
      }

      switchingCamera = true;
      switchButton.disabled = true;
      setStatus("正在切換鏡頭⋯⋯", "processing");

      const oldIndex = currentCameraIndex;

      try {
        await scanner.stop();
        scannerRunning = false;

        currentCameraIndex =
          (currentCameraIndex + 1) % cameras.length;

        await startCurrentCamera();
      } catch (error) {
        console.error(error);
        currentCameraIndex = oldIndex;

        try {
          await startCurrentCamera();

          setStatus(
            "切換失敗，已恢復原本鏡頭",
            "error"
          );

          setTimeout(function() {
            setStatus("等待掃描中⋯⋯", "ready");
          }, 2000);
        } catch (_) {
          scannerRunning = false;
          startButton.style.display = "inline-block";
          startButton.disabled = false;

          setStatus(
            "請重新整理網頁後再啟動掃描器",
            "error"
          );
        }
      } finally {
        switchingCamera = false;

        if (scannerRunning && cameras.length > 1) {
          switchButton.disabled = false;
        }
      }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      const cleanText = decodedText.trim();

      if (processing || switchingCamera) {
        return;
      }

      if (
        cleanText === lastCode &&
        now - lastScanAt < 5000
      ) {
        return;
      }

      lastCode = cleanText;
      lastScanAt = now;

      if (!isValidCheckinUrl(cleanText)) {
        setStatus(
          "這不是有效的學生簽到 QR Code",
          "error"
        );

        setTimeout(function() {
          if (!processing) {
            setStatus("等待掃描中⋯⋯", "ready");
          }
        }, 2200);

        return;
      }

      processing = true;
      switchButton.disabled = true;

      setStatus("簽到處理中⋯⋯", "processing");

      try {
        scanner.pause(true);
      } catch (_) {}

      checkinFrame.src = cleanText;

      setTimeout(function() {
        setStatus(
          "✅ 已送出簽到，可準備下一位",
          "success"
        );
      }, 1200);

      setTimeout(function() {
        processing = false;
        checkinFrame.removeAttribute("src");

        try {
          scanner.resume();
        } catch (_) {}

        setStatus("等待掃描中⋯⋯", "ready");

        if (cameras.length > 1) {
          switchButton.disabled = false;
        }
      }, 3500);
    }

    function onScanFailure(_) {
      // 持續掃描，不顯示錯誤。
    }

    startButton.addEventListener("click", startScanner);
    switchButton.addEventListener("click", switchCamera);
  </script>
</body>
</html>
